# Puertas de la CI (docs/TESTING.md §6). Nunca recibe credenciales de Meta ni de LLM.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://app_rw:app_rw_local@localhost:55432/ad_astra
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Roles de base de datos
        run: psql "postgres://postgres:postgres_ci@localhost:55432/postgres" -v ON_ERROR_STOP=1 -f db/init/01-roles.sql
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm docs:check
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
